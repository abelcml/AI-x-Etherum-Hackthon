<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK Bounty Demo</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<main>
  <h1>HSK 鏈上懸賞 · 驗收 Demo</h1>
  <p class="sub">只讀頁面：讀鏈上狀態、向 GitHub 驗收、CSV 驗收。不送出任何交易。</p>

  <section class="card">
    <h2>① 鏈上任務（HSK 測試網 133）</h2>
    <div class="row">任務 ID <input id="jobIdInput" type="number" min="1" value="3"><button id="loadJob">讀取鏈上狀態</button></div>
    <div id="jobOut"></div>
  </section>

  <section class="card">
    <h2>② GitHub 驗收：同一個 commit 通過 CI 並被 merge</h2>
    <div class="row">PR 編號 <input id="prInput" type="number" min="1" value="10"><button id="verifyPr">驗收</button></div>
    <div id="prOut"></div>
  </section>

  <section class="card">
    <h2>③ CSV 去重驗收</h2>
    <div class="row"><button id="csvGood">執行並驗收</button><button id="csvBad" class="alt">刪一列再驗</button></div>
    <div id="csvOut"></div>
  </section>
</main>
<script src="/demo.js"></script>
</body>
</html>
